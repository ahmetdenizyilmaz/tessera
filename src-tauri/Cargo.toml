[package]
name = "tessera"
version = "0.4.4"
edition = "2021"

[lib]
name = "tessera_lib"
crate-type = ["lib"]

[[bin]]
name = "tessera"
path = "src/main.rs"

[features]
preview = []

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-build = { version = "2", features = [] }
portable-pty = "0.8"
# Inspect Codex's rendered startup dialog, including ConPTY partial repaints.
vt100 = "0.16.2"
sysinfo = "0.33"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
xcap = "0.0.9"
enigo = "0.2"
base64 = "0.22"
image = "0.25"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
whoami = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
zstd = "0.13"
ignore = "0.4"
# Loopback MCP server for panel-to-panel messaging. All three are already in
# Cargo.lock via reqwest/tauri, so this adds no new crates to the tree.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
http-body-util = "0.1"
# Direct LAN peer transport. Noise provides authenticated encryption for both
# the one-time pairing handshake and every subsequent device-key connection.
snow = "0.9"
sha2 = "0.10"
if-addrs = "0.13"
# Already used by Tokio. Creates non-inheritable Windows sockets atomically.
socket2 = "0.6"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Media_Control", "Storage_Streams", "Win32_System_WinRT"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = ["Media_Playback", "Storage"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
