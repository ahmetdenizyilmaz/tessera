<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger</title>
<style>
  :root {
    --bg: #1e1e2e;
    --bg-surface: #313244;
    --bg-input: #181825;
    --text: #cdd6f4;
    --text-muted: #6c7086;
    --accent: #a6e3a1;
    --accent2: #89b4fa;
    --border: #45475a;
    --hover: #3b3b52;
    --sent: #313244;
    --received: #1e3a5f;
  }
  .light {
    --bg: #ffffff;
    --bg-surface: #f5f5f5;
    --bg-input: #e8e8e8;
    --text: #1e1e2e;
    --text-muted: #888;
    --border: #ddd;
    --hover: #eee;
    --sent: #e8e8e8;
    --received: #d4e8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header / Instance selector */
  .header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-surface);
  }
  .header-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .header-row:last-child { margin-bottom: 0; }
  .header label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    min-width: 50px;
  }
  select, .broadcast-input {
    flex: 1;
    padding: 5px 8px;
    font-size: 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    outline: none;
    font-family: inherit;
  }
  select:focus, .broadcast-input:focus { border-color: var(--accent); }
  .btn {
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 600;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: opacity 0.15s;
    font-family: inherit;
  }
  .btn:hover { opacity: 0.85; }
  .btn-refresh { background: var(--accent2); color: #1e1e2e; }
  .btn-broadcast { background: var(--accent); color: #1e1e2e; }
  .mode-tabs {
    display: flex;
    gap: 0;
    background: var(--bg-input);
    border-radius: 6px;
    padding: 2px;
    flex: 1;
  }
  .mode-tab {
    flex: 1;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: 600;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.15s;
    text-align: center;
  }
  .mode-tab.active {
    background: var(--accent2);
    color: #1e1e2e;
  }

  /* Message log */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px;
  }
  .msg {
    padding: 6px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    max-width: 90%;
  }
  .msg.sent {
    background: var(--sent);
    margin-left: auto;
    text-align: right;
  }
  .msg.received {
    background: var(--received);
  }
  .msg.system {
    background: none;
    color: var(--text-muted);
    font-size: 11px;
    text-align: center;
    max-width: 100%;
    font-style: italic;
  }
  .msg-from {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .msg-time {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .msg-data {
    font-family: 'Consolas', 'Monaco', monospace;
    word-break: break-all;
  }

  /* Input */
  .input-bar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
  }
  .input-bar input {
    flex: 1;
    padding: 7px 10px;
    font-size: 12px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    outline: none;
    font-family: inherit;
  }
  .input-bar input:focus { border-color: var(--accent); }
  .btn-send { background: var(--accent2); color: #1e1e2e; padding: 7px 16px; border-radius: 6px; }

  /* Instance list */
  .instance-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
  }
  .instance-item option { padding: 2px 4px; }
  .type-badge {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--accent2);
    color: #1e1e2e;
  }

  .empty-hint {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
    font-style: italic;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <label>Mode</label>
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="chat">Chat (LLM)</button>
      <button class="mode-tab" data-mode="direct">Direct Msg</button>
      <button class="mode-tab" data-mode="broadcast">Broadcast</button>
    </div>
  </div>

  <!-- Chat (LLM) mode -->
  <div id="chatControls">
    <div class="header-row">
      <label>Target</label>
      <select id="chatTargetSelect"><option value="">Loading chats...</option></select>
      <button class="btn btn-refresh" id="btnRefreshChats" title="Refresh chat list">&#x21bb;</button>
    </div>
  </div>

  <!-- Direct mode -->
  <div id="directControls" style="display:none;">
    <div class="header-row">
      <label>Target</label>
      <select id="targetSelect"><option value="">Loading instances...</option></select>
      <button class="btn btn-refresh" id="btnRefresh" title="Refresh instance list">&#x21bb;</button>
    </div>
  </div>

  <!-- Broadcast mode -->
  <div id="broadcastControls" style="display:none;">
    <div class="header-row">
      <label>Channel</label>
      <input class="broadcast-input" id="channelInput" value="test" placeholder="Channel name..." />
      <button class="btn btn-broadcast" id="btnSubscribe">Subscribe</button>
    </div>
  </div>
</div>

<div class="messages" id="messages">
  <div class="empty-hint" id="emptyHint">Send messages to LLM chats, plugins, or broadcast channels</div>
</div>

<div class="input-bar">
  <input type="text" id="msgInput" placeholder="Ask the LLM something..." />
  <button class="btn btn-send" id="btnSend">Send</button>
</div>

<script>
(function() {
  'use strict';

  var instanceId = null;
  var mode = 'chat'; // 'chat' | 'direct' | 'broadcast'
  var subscribedChannels = new Set();
  var messages = [];
  var messageCount = 0;
  var receivedCount = 0;

  // DOM
  var chatTargetSelect = document.getElementById('chatTargetSelect');
  var targetSelect = document.getElementById('targetSelect');
  var msgInput = document.getElementById('msgInput');
  var messagesEl = document.getElementById('messages');
  var emptyHint = document.getElementById('emptyHint');
  var btnSend = document.getElementById('btnSend');
  var btnRefresh = document.getElementById('btnRefresh');
  var btnRefreshChats = document.getElementById('btnRefreshChats');
  var btnSubscribe = document.getElementById('btnSubscribe');
  var channelInput = document.getElementById('channelInput');
  var chatControls = document.getElementById('chatControls');
  var directControls = document.getElementById('directControls');
  var broadcastControls = document.getElementById('broadcastControls');
  var modeTabs = document.querySelectorAll('.mode-tab');

  // ── Mode Switching ──
  modeTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      mode = tab.dataset.mode;
      modeTabs.forEach(function(t) { t.classList.toggle('active', t.dataset.mode === mode); });
      chatControls.style.display = mode === 'chat' ? 'block' : 'none';
      directControls.style.display = mode === 'direct' ? 'block' : 'none';
      broadcastControls.style.display = mode === 'broadcast' ? 'block' : 'none';
      msgInput.placeholder = mode === 'chat' ? 'Ask the LLM something...'
        : mode === 'direct' ? 'Type a message...' : 'Broadcast message...';
    });
  });

  // ── Refresh Instance Lists ──
  function refreshInstances() {
    if (!window.ClaudeGUI) return;
    window.ClaudeGUI.instances.list().then(function(list) {
      targetSelect.innerHTML = '';
      chatTargetSelect.innerHTML = '';
      var count = 0;
      var chatCount = 0;
      list.forEach(function(inst) {
        if (inst.id === instanceId) return;
        // Only show chat/LLM instances that have an active session
        if ((inst.type === 'chat' || inst.type === 'llm') && inst.hasSession) {
          chatCount++;
          var chatOpt = document.createElement('option');
          chatOpt.value = inst.id;
          chatOpt.textContent = inst.name + ' (' + inst.id.slice(0, 8) + '...)';
          chatTargetSelect.appendChild(chatOpt);
        }
        // All instances go in direct target
        count++;
        var opt = document.createElement('option');
        opt.value = inst.id;
        var typeLabel = inst.type.toUpperCase();
        if (inst.pluginName) typeLabel += ':' + inst.pluginName;
        opt.textContent = '[' + typeLabel + '] ' + inst.name + ' (' + inst.id.slice(0, 8) + '...)';
        targetSelect.appendChild(opt);
      });
      if (count === 0) {
        var opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'No other instances found';
        targetSelect.appendChild(opt);
      }
      if (chatCount === 0) {
        var chatOpt = document.createElement('option');
        chatOpt.value = '';
        chatOpt.textContent = 'No chat instances — open a Claude panel first';
        chatTargetSelect.appendChild(chatOpt);
      }
      addSystemMessage('Found ' + chatCount + ' chat(s), ' + count + ' total instance(s)');
    }).catch(function(err) {
      addSystemMessage('Error listing instances: ' + err.message);
    });
  }

  // ── Send ──
  function send() {
    var text = msgInput.value.trim();
    if (!text) return;

    if (mode === 'chat') {
      var chatTarget = chatTargetSelect.value;
      if (!chatTarget) {
        addSystemMessage('No chat instance selected — open a Claude panel first');
        return;
      }
      var chatLabel = chatTargetSelect.options[chatTargetSelect.selectedIndex].textContent;
      window.ClaudeGUI.chat.send(chatTarget, text).then(function() {
        addMessage('sent', 'To LLM: ' + chatLabel, text);
        addSystemMessage('Waiting for response...');
      }).catch(function(err) {
        addSystemMessage('Chat send error: ' + err.message);
      });
    } else if (mode === 'direct') {
      var targetId = targetSelect.value;
      if (!targetId) {
        addSystemMessage('No target selected');
        return;
      }
      var targetLabel = targetSelect.options[targetSelect.selectedIndex].textContent;
      window.ClaudeGUI.messaging.send(targetId, { text: text, timestamp: Date.now() }).then(function() {
        addMessage('sent', 'To: ' + targetLabel, text);
      }).catch(function(err) {
        addSystemMessage('Send error: ' + err.message);
      });
    } else {
      var channel = channelInput.value.trim() || 'test';
      window.ClaudeGUI.messaging.broadcast(channel, { text: text, sender: instanceId, timestamp: Date.now() });
      addMessage('sent', 'Broadcast [' + channel + ']', text);
    }

    msgInput.value = '';
    msgInput.focus();
  }

  // ── Subscribe to Broadcast ──
  function subscribeToBroadcast() {
    var channel = channelInput.value.trim();
    if (!channel) return;
    if (subscribedChannels.has(channel)) {
      addSystemMessage('Already subscribed to "' + channel + '"');
      return;
    }
    subscribedChannels.add(channel);
    window.ClaudeGUI.messaging.onBroadcast(channel, function(data) {
      var payload = data.data || data;
      if (payload.sender === instanceId) return; // skip own broadcasts
      var text = payload.text || JSON.stringify(payload);
      addMessage('received', 'Broadcast [' + channel + ']', text);
    });
    addSystemMessage('Subscribed to broadcast channel "' + channel + '"');
  }

  // ── Message Rendering ──
  function addMessage(type, from, text) {
    messageCount++;
    emptyHint.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'msg ' + type;
    var time = new Date().toLocaleTimeString();
    div.innerHTML =
      '<div class="msg-from">' + escapeHtml(from) + '</div>' +
      '<div class="msg-data">' + escapeHtml(text) + '</div>' +
      '<div class="msg-time">' + time + '</div>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    // Update badge
    if (window.ClaudeGUI && type === 'received') {
      window.ClaudeGUI.ui.setBadge(messageCount);
    }
  }

  function addSystemMessage(text) {
    emptyHint.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'msg system';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ── Events ──
  btnSend.addEventListener('click', send);
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') send();
  });
  btnRefresh.addEventListener('click', refreshInstances);
  btnRefreshChats.addEventListener('click', refreshInstances);
  btnSubscribe.addEventListener('click', subscribeToBroadcast);

  // ── SDK Init ──
  function initSdk() {
    if (!window.ClaudeGUI) {
      setTimeout(initSdk, 100);
      return;
    }

    window.ClaudeGUI.on('init', function(data) {
      instanceId = data.instanceId;
      addSystemMessage('Messenger initialized — ID: ' + instanceId.slice(0, 12) + '...');

      // Apply theme
      if (data.theme) applyTheme(data.theme);

      // Refresh instance list
      setTimeout(refreshInstances, 300);

      // Listen for LLM chat responses
      window.ClaudeGUI.chat.onResponse(function(resp) {
        var text = resp.text || '(no text)';
        var from = 'LLM [' + (resp.instanceId || '').slice(0, 8) + '...]';
        // Only show complete (non-streaming) responses to avoid duplicates
        if (!resp.isStreaming) {
          addMessage('received', from, text);
        }
      });

      // Listen for direct messages from other plugins
      window.ClaudeGUI.messaging.onMessage(function(msg) {
        var payload = msg.data || msg;
        var data = payload.data || payload;
        var text = data.text || JSON.stringify(data);
        var from = 'From: ' + (payload.sourceId || payload.from || 'unknown').slice(0, 12) + '...';
        addMessage('received', from, text);
      });

      // Auto-subscribe to "test" broadcast channel
      subscribedChannels.add('test');
      window.ClaudeGUI.messaging.onBroadcast('test', function(data) {
        var payload = data.data || data;
        if (payload.sender === instanceId) return;
        var text = payload.text || JSON.stringify(payload);
        addMessage('received', 'Broadcast [test]', text);
      });
      addSystemMessage('Auto-subscribed to broadcast channel "test"');
    });

    window.ClaudeGUI.theme.onChange(function(theme) {
      applyTheme(theme);
    });

    window.ClaudeGUI.onDestroy(function() {
      // nothing to persist
    });
  }

  function applyTheme(theme) {
    if (theme && !theme.isDark) {
      document.body.classList.add('light');
    } else {
      document.body.classList.remove('light');
    }
  }

  initSdk();
})();
</script>
</body>
</html>
