
# Build the Windows installer in CI and attach it to a GitHub Release, so
# users download a ready-made setup.exe instead of installing Rust + Node
# and sitting through a cold tauri build.
#
#   Cut a release:   git tag v0.1.0 && git push origin v0.1.0
#   Test the build:  Actions tab -> Release -> Run workflow (artifact only)
#
# The release is created as a DRAFT - review the notes, then publish.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Caches ~/.cargo and src-tauri/target between runs: the first CI build
      # is a cold ~15 min, later ones drop to a few minutes.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Cache Codex terminal renderer
        id: codex-renderer-cache
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/codex-terminal/*.exe
            src-tauri/resources/codex-terminal/*.dll
            src-tauri/resources/codex-terminal/manifest.json
          key: codex-renderer-windows-msvc-1.95.0-${{ hashFiles('patches/codex-terminal/buffer-history.patch', 'tools/build-codex-terminal.ps1') }}

      # Include the same native history-rendering fix as the tested desktop build.
      # The installed official Codex CLI still handles models and tools.
      - name: Build patched Codex terminal renderer
        if: steps.codex-renderer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0-x86_64-pc-windows-msvc --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned renderer toolchain.' }
          ./tools/build-codex-terminal.ps1 -Toolchain '1.95.0-x86_64-pc-windows-msvc'

      # On a tag: builds, creates a draft release for that tag, uploads the
      # NSIS installer to it. On workflow_dispatch: build only (no release).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config src-tauri/tauri.stable.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Tessera {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      # Manual runs still hand you the installer as a workflow artifact.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: tessera-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
