<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title><style>
:root{color-scheme:dark;font:14px/1.5 system-ui;color:#e5ede8;background:#141b20;--muted:#91a59e;--line:#2c3a40;--accent:#bbdbc8}*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:205px minmax(0,1fr);overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:#223039;border:1px solid var(--line);border-radius:9px;padding:8px 12px}button:hover{background:#30433f}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}button:disabled{opacity:.4;cursor:default}aside{display:flex;flex-direction:column;min-height:0;background:#192329;border-right:1px solid var(--line);padding:18px 12px;gap:12px}h1{font-size:19px;font-weight:600;margin:0}aside header{display:flex;align-items:center;justify-content:space-between;padding:0 3px}#new{background:var(--accent);color:#14251c;font-size:19px;line-height:20px;padding:5px 11px}#search{width:100%;background:#111b20;border:1px solid var(--line);padding:9px 10px;border-radius:8px;font-size:12px}#list{overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#42594f transparent}.note{display:block;width:100%;border:1px solid transparent;text-align:left;margin:3px 0;padding:11px 10px;background:transparent}.note.active{background:#2a3d38;border-color:#476458}.note strong,.note small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.note strong{font-size:13px;font-weight:550}.note small{color:var(--muted);font-size:11px;margin-top:4px}#trash{font-size:11px;color:var(--muted);background:none}main{min-width:0;display:flex;flex-direction:column;padding:22px 26px;gap:14px}main header{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}#status{flex:1}#delete,#retry{font-size:11px}#title{background:none;border:0;padding:12px 0 5px;font-size:24px;outline:none;width:100%;font-weight:550}#note{width:100%;flex:1;resize:none;background:none;border:0;padding:0;line-height:1.85;outline:none;min-height:70px;scrollbar-width:thin}footer{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}#toggle{display:none}#empty{color:var(--muted);font-size:12px;padding:10px}#status.error{color:#f4aa96}@media(max-width:540px){body{grid-template-columns:155px minmax(0,1fr)}aside{padding:12px 8px}main{padding:15px}#title{font-size:20px}}@media(max-width:360px){body{display:block}aside{display:none;position:absolute;inset:50px 0 0;z-index:1}.show-list aside{display:flex}main{height:100%}#toggle{display:block;padding:3px 7px}}
</style></head><body><aside><header><h1>Notes</h1><button id="new" title="New note" aria-label="New note" disabled>+</button></header><input id="search" type="search" placeholder="Search your notes" aria-label="Search notes"><div id="list"></div><button id="trash">Show trash</button></aside><main><header><button id="toggle" aria-label="Toggle note list">☰</button><span id="status" role="status">Loading notes…</span><button id="retry" hidden>Retry save</button><button id="delete" disabled>Move to trash</button></header><input id="title" aria-label="Note title" placeholder="Untitled" disabled><textarea id="note" aria-label="Note content" placeholder="A little space to think…" disabled></textarea><footer><span>Saved on this computer</span><span id="count">0 words</span></footer></main><script>
const $=id=>document.getElementById(id),items=new Map(),pending=new Map();let active=null,showTrash=false,queue=Promise.resolve(),busy=false;
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);$('retry').hidden=!error;}
function count(){const text=$('note').value.trim();$('count').textContent=(text?text.split(/\s+/).length:0)+' words';}
function list(){const query=$('search').value.toLowerCase();$('list').replaceChildren();const filtered=[...items.values()].filter(n=>!!n.deleted===showTrash&&(n.title+' '+n.content).toLowerCase().includes(query)).sort((a,b)=>b.updatedAt-a.updatedAt);for(const n of filtered){const button=document.createElement('button');button.className='note'+(n.id===active?' active':'');const title=document.createElement('strong'),sub=document.createElement('small');title.textContent=n.title||'Untitled';sub.textContent=n.content.trim().split('\n')[0]||'Empty note';button.append(title,sub);button.onclick=()=>select(n.id);$('list').append(button);}if(!filtered.length){const p=document.createElement('p');p.id='empty';p.textContent=showTrash?'Trash is empty.':query?'No matching notes.':'Create your first note.';$('list').append(p);}}
function select(id){active=id;const n=items.get(id);$('title').value=n?.title||'';$('note').value=n?.content||'';$('title').disabled=$('note').disabled=!n||!!n.deleted;$('delete').disabled=!n;$('delete').textContent=n?.deleted?'Restore note':'Move to trash';document.body.classList.remove('show-list');count();list();}
function save(n){const snapshot=JSON.parse(JSON.stringify(n));pending.set(n.id,snapshot);status('Saving…');queue=queue.catch(()=>{}).then(async()=>{await Tessera.storage.set('note:'+n.id,snapshot);if(pending.get(n.id)===snapshot)pending.delete(n.id);if(!pending.size)status('Saved');}).catch(()=>status('Could not save. Your changes are still here.',true));}
function create(){const n={id:crypto.randomUUID(),title:'',content:'',updatedAt:Date.now(),deleted:false};items.set(n.id,n);showTrash=false;$('trash').textContent='Show trash';select(n.id);save(n);$('title').focus();}
async function sync(){if(busy)return;busy=true;try{const entries=await Tessera.storage.entries('note:');for(const n of Object.values(entries)){if(!n||typeof n.id!=='string'||typeof n.title!=='string'||typeof n.content!=='string')continue;if(pending.has(n.id))continue;const old=items.get(n.id);if(n.id===active&&['title','note'].includes(document.activeElement?.id))continue;if(!old||old.updatedAt<n.updatedAt){items.set(n.id,n);if(active===n.id)select(active);}}list();}finally{busy=false;}}
$('new').onclick=create;$('search').oninput=list;$('toggle').onclick=()=>document.body.classList.toggle('show-list');$('trash').onclick=()=>{showTrash=!showTrash;$('trash').textContent=showTrash?'Back to notes':'Show trash';select([...items.values()].find(n=>!!n.deleted===showTrash)?.id??null);};
for(const [id,field] of [['title','title'],['note','content']])$(id).oninput=()=>{const n=items.get(active);if(!n)return;n[field]=$(id).value;n.updatedAt=Date.now();save(n);count();list();};
$('delete').onclick=()=>{const n=items.get(active);if(!n)return;n.deleted=!n.deleted;n.updatedAt=Date.now();save(n);select([...items.values()].find(v=>!!v.deleted===showTrash)?.id??null);};$('retry').onclick=()=>{for(const n of [...pending.values()])save(n);};
Tessera.ready.then(async()=>{await sync();$('new').disabled=false;select([...items.values()].filter(n=>!n.deleted).sort((a,b)=>b.updatedAt-a.updatedAt)[0]?.id??null);status('Saved');setInterval(()=>{if(!document.hidden)sync().catch(()=>{});},3000);}).catch(e=>status(String(e),true));
</script></body></html>
