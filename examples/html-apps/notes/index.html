<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quick Notes</title><style>
*{box-sizing:border-box}body{margin:0;background:#171d25;color:#e6ede9;font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;padding:20px}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}h1{font-size:18px;font-weight:600;margin:0;flex:1}#status{color:#9db3a8;font-size:12px}textarea{resize:none;flex:1;min-height:80px;width:100%;border:1px solid #34483e;border-radius:12px;padding:16px;background:#202b25;color:#edf4ef;font:15px/1.7 system-ui;outline:none}textarea:focus{border-color:#8ac4a6}footer{color:#8b9d93;font-size:11px;margin-top:12px}
</style></head><body><header><h1>Quick Notes</h1><span id="status" role="status">Loading…</span></header><textarea id="note" aria-label="Your notes" placeholder="A thought, a reminder, an idea…" disabled></textarea><footer>Private app storage · Saved locally · Shared by this app’s panels</footer><script>
const note=document.querySelector('#note'), status=document.querySelector('#status');let generation=0,saves=Promise.resolve();
Tessera.ready.then(async()=>{note.value=await Tessera.storage.get('notes','');note.disabled=false;status.textContent='Saved';}).catch(error=>{status.textContent=error.message;});
note.addEventListener('input',()=>{const current=++generation,value=note.value;status.textContent='Saving…';saves=saves.then(()=>Tessera.storage.set('notes',value)).then(()=>{if(current===generation)status.textContent='Saved';}).catch(error=>{if(current===generation)status.textContent=String(error);});});
</script></body></html>
