<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clock</title><style>
:root{color-scheme:dark;font:14px system-ui;background:#1c1c24;color:#eee9df}*{box-sizing:border-box}body{margin:0;padding:26px;min-height:100vh;display:flex;flex-direction:column;gap:24px}header{display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:17px;font-weight:500;margin:0}button,select{font:inherit;color:inherit;background:#2d2c38;border:1px solid #494351;border-radius:8px;padding:8px 11px}button{cursor:pointer}button:hover{background:#423c4a}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #dcc6a6;outline-offset:2px}.hero{flex:1;display:grid;place-content:center;text-align:center;gap:12px;min-height:150px}#local-label{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#c0ab94}#time{font-size:clamp(40px,12vw,86px);font-weight:250;font-variant-numeric:tabular-nums;letter-spacing:-2px}#date{font-size:13px;color:#aaa1ad}#zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.zone{background:#26252f;border:1px solid #3b3745;border-radius:12px;padding:14px;position:relative}.zone h2{font-size:12px;font-weight:500;margin:0 20px 12px 0;color:#c4bacb}.zone time{font-size:23px;font-weight:350;font-variant-numeric:tabular-nums}.zone small{display:block;color:#9990a2;font-size:10px;margin-top:6px}.zone button{position:absolute;right:5px;top:5px;padding:2px 6px;background:transparent;border:0;color:#9990a2}form{display:flex;gap:8px;flex-wrap:wrap}select{flex:1;min-width:100px;font-size:12px}footer{font-size:11px;color:#9990a2;line-height:1.6}#error{color:#f0ad99;font-size:12px;margin:0}
</style></head><body><header><h1>Clock</h1><button id="format" aria-label="Toggle 12 or 24 hour time" disabled>24 hour</button></header><div class="hero"><span id="local-label">Local time</span><time id="time">--:--:--</time><span id="date"></span></div><div id="zones"></div><form id="add"><select id="zone" aria-label="Time zone"></select><button type="submit" disabled>Add clock</button></form><footer>Keep a little time for everywhere.<br>World clocks use your computer’s clock. No internet needed.</footer><p id="error" role="alert"></p><script>
const $=id=>document.getElementById(id);let settings={hour12:false,zones:['UTC']},queue=Promise.resolve();const local=Intl.DateTimeFormat().resolvedOptions().timeZone;const all=[...new Set(['UTC',...(Intl.supportedValuesOf?Intl.supportedValuesOf('timeZone'):['Europe/Istanbul','Europe/London','America/New_York','Asia/Tokyo'])])];for(const z of all){const option=document.createElement('option');option.value=z;option.textContent=z.replaceAll('_',' ');$('zone').append(option);}function valid(zone){try{new Intl.DateTimeFormat('en',{timeZone:zone});return true;}catch{return false;}}
function save(){const value=JSON.parse(JSON.stringify(settings));queue=queue.catch(()=>{}).then(()=>Tessera.storage.set('clocks',value,'panel')).then(()=>{$('error').textContent='';}).catch(()=>{$('error').textContent='Could not save clock settings.';});}function time(now,zone,seconds=false){return new Intl.DateTimeFormat(undefined,{timeZone:zone,hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{}),hour12:settings.hour12}).format(now);}
function render(){const now=new Date();$('time').textContent=time(now,local,true);$('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(now);$('local-label').textContent=(local?.split('/').pop()||'Local time').replaceAll('_',' ');$('format').textContent=settings.hour12?'12 hour':'24 hour';for(const card of $('zones').children){card.querySelector('time').textContent=time(now,card.dataset.zone);card.querySelector('small').textContent=new Intl.DateTimeFormat(undefined,{timeZone:card.dataset.zone,weekday:'short',month:'short',day:'numeric',timeZoneName:'shortOffset'}).format(now);}}
function cards(){$('zones').replaceChildren();for(const zone of settings.zones){const card=document.createElement('article');card.className='zone';card.dataset.zone=zone;const h=document.createElement('h2'),t=document.createElement('time'),date=document.createElement('small'),remove=document.createElement('button');h.textContent=zone.replaceAll('_',' ');remove.textContent='×';remove.ariaLabel='Remove '+zone;remove.onclick=()=>{settings.zones=settings.zones.filter(z=>z!==zone);save();cards();};card.append(h,t,date,remove);$('zones').append(card);}render();}$('format').onclick=()=>{settings.hour12=!settings.hour12;save();render();};$('add').onsubmit=e=>{e.preventDefault();const zone=$('zone').value;if(settings.zones.length<12&&!settings.zones.includes(zone)&&valid(zone)){settings.zones.push(zone);save();cards();}};
Tessera.ready.then(async()=>{const saved=await Tessera.storage.get('clocks',null,'panel');if(saved&&Array.isArray(saved.zones)){settings={hour12:!!saved.hour12,zones:[...new Set(saved.zones.filter(z=>typeof z==='string'&&valid(z)))].slice(0,12)};}document.querySelectorAll('button').forEach(el=>el.disabled=false);cards();setInterval(render,1000);}).catch(e=>{$('error').textContent=String(e);});
</script></body></html>
