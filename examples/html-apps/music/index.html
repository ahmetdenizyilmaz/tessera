<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Remote</title>
<style>
:root{color-scheme:dark;--accent:#9ce8c0;--text:#edf4f5;--muted:#95a6af;font:14px/1.45 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:#131b24;display:grid;place-items:center;padding:24px}button,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.3;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button{border:1px solid #ffffff1b;background:#ffffff08;border-radius:12px;padding:10px;display:inline-flex;justify-content:center;align-items:center;gap:7px}button:hover:not(:disabled){background:#ffffff18}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.player{width:100%;max-width:490px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}select{min-width:0;max-width:100%;width:100%;border:0;background:#17222c;border-radius:8px;padding:8px 24px 8px 8px;outline-offset:2px;font-size:12px}.source{min-width:0;flex:1}.source span{display:block;margin-bottom:6px}.art{position:relative;aspect-ratio:1;max-width:290px;width:72%;margin:0 auto 24px;border-radius:20px;overflow:hidden;background:linear-gradient(145deg,#34434c,#172a35 70%);box-shadow:0 20px 50px #0004;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.art svg{width:70px;height:70px;color:var(--accent);opacity:.75}.art[hidden]{display:none}.metadata{text-align:center;margin-bottom:22px}.metadata h1{font-size:clamp(18px,4vw,25px);line-height:1.3;margin:0 0 6px;overflow-wrap:anywhere;letter-spacing:-.02em}.metadata p{margin:0;color:var(--muted);overflow-wrap:anywhere}.track{width:100%;accent-color:var(--accent);display:block;margin:0}.timeline{margin:20px 0 14px}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;margin-top:7px}.controls{display:flex;align-items:center;justify-content:center;gap:20px}.controls button{width:43px;height:43px;border:0;border-radius:50%;background:transparent}.controls #play{width:58px;height:58px;background:var(--accent);color:#122327;box-shadow:0 5px 22px #0003}.controls svg{width:25px;height:25px}.controls button:hover:not(:disabled){filter:brightness(1.1);background:#ffffff18}.controls #play:hover:not(:disabled){background:var(--accent)}.message{color:var(--muted);text-align:center;font-size:12px;min-height:18px;margin:20px 0 0}.empty{text-align:center;padding:25px 8px}.empty h2{font-size:20px;margin:16px 0 8px}.empty p{color:var(--muted);max-width:320px;margin:0 auto 20px}.empty button{color:var(--accent)}[hidden]{display:none!important}.settings{margin-bottom:22px;background:#0c131bcc;border:1px solid #ffffff1b;border-radius:14px;padding:16px}.settings label{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.settings input{accent-color:var(--accent)}.swatches{display:flex;gap:8px}.swatches button{width:25px;height:25px;background:var(--swatch);padding:0;border:2px solid transparent;border-radius:50%}.swatches button[aria-pressed=true]{outline:2px solid white;outline-offset:2px}.settings footer{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:16px}.settings footer button{font-size:11px;padding:7px}.compact .art{display:none}@media(max-width:340px),(max-height:540px){body{padding:16px}.top{margin-bottom:14px}.art{max-width:160px;margin-bottom:15px}.metadata{margin-bottom:12px}.timeline{margin-top:10px}.message{margin-top:12px}}@media(max-height:390px){.art{display:none}.controls #play{width:45px;height:45px}.top{margin-bottom:8px}.metadata h1{font-size:18px}.message{margin-top:8px}}
</style></head><body>
<svg style="display:none" aria-hidden="true"><symbol id="music" viewBox="0 0 24 24"><path d="M9 18V5l12-3v13M9 9l12-3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="15" r="3"/></symbol><symbol id="gear" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3" fill="#17222c"/><circle cx="16" cy="17" r="3" fill="#17222c"/></symbol><symbol id="prev" viewBox="0 0 24 24"><path d="M5 5v14M19 5l-11 7 11 7z"/></symbol><symbol id="next-icon" viewBox="0 0 24 24"><path d="M19 5v14M5 5l11 7-11 7z"/></symbol><symbol id="play-icon" viewBox="0 0 24 24"><path d="m8 4 13 8-13 8z"/></symbol><symbol id="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol></svg>
<main class="player"><header class="top"><div class="source"><span class="eyebrow">Music remote</span><select id="source" aria-label="Media player"><option value="">Follow active player</option></select></div><button id="settings-toggle" aria-label="Music remote settings" aria-expanded="false"><svg><use href="#gear"/></svg></button></header>
<section class="settings" id="settings" hidden aria-label="Music remote settings"><label>Show cover art<input id="show-cover" type="checkbox" checked></label><label>Accent color<span class="swatches" id="swatches"></span></label><footer><span>Saved for this panel</span><button id="permissions">App permissions</button></footer></section>
<section id="empty" class="empty"><svg style="width:48px;height:48px"><use href="#music"/></svg><h2 id="empty-title">Connect your music</h2><p id="empty-text">Allow media access to see cover art and control your Windows players.</p><button id="enable">Allow media access…</button></section>
<section id="now" hidden><div class="art" id="art"><svg aria-hidden="true"><use href="#music"/></svg><img id="cover" alt="Album cover" hidden></div><div class="metadata"><h1 id="title"></h1><p id="artist"></p></div><div class="timeline"><input id="seek" class="track" type="range" min="0" max="1" step="1" value="0" aria-label="Playback position"><div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div></div><div class="controls"><button id="previous" aria-label="Previous track"><svg><use href="#prev"/></svg></button><button id="play" aria-label="Play"><svg><use id="play-shape" href="#play-icon"/></svg></button><button id="next" aria-label="Next track"><svg><use href="#next-icon"/></svg></button></div></section><p id="message" class="message" role="status"></p></main>
<script>
const $=id=>document.getElementById(id);let options={showCover:true,accent:'#9ce8c0',source:'',sourceApp:''},current=null,sessions=[],artworkKey=null,busy=false,requesting=false,refreshPending=false,selectionVersion=0,seeking=false,hasControl=false,lastTitle='';
const colors=['#9ce8c0','#9fc8ff','#c4b5fd','#f6bc92'];const time=s=>`${Math.floor(Math.max(0,s)/60)}:${String(Math.floor(Math.max(0,s)%60)).padStart(2,'0')}`;
function sourceName(source){return /spotify/i.test(source)?'Spotify':/chrome/i.test(source)?'Chrome':/msedge/i.test(source)?'Microsoft Edge':source.split('!').pop().replace(/\.exe$/i,'');}
function appearance(){document.documentElement.style.setProperty('--accent',options.accent);$('show-cover').checked=options.showCover;$('art').hidden=!options.showCover;for(const b of $('swatches').children)b.setAttribute('aria-pressed',String(b.dataset.color===options.accent));}
let saving=Promise.resolve();function save(){const value={...options};saving=saving.catch(()=>{}).then(()=>Tessera.storage.set('preferences',value,'panel')).catch(()=>{$('message').textContent='Could not save your music settings.';});}
for(const color of colors){const b=document.createElement('button');b.dataset.color=color;b.style.setProperty('--swatch',color);b.setAttribute('aria-label',`Use ${color} accent`);b.onclick=()=>{options.accent=color;appearance();save();};$('swatches').append(b);}
$('settings-toggle').onclick=()=>{$('settings').hidden=!$('settings').hidden;$('settings-toggle').setAttribute('aria-expanded',String(!$('settings').hidden));};
$('show-cover').onchange=()=>{options.showCover=$('show-cover').checked;appearance();save();};
for(const id of ['enable','permissions'])$(id).onclick=()=>Tessera.ui.openPermissions().catch(e=>{$('message').textContent=String(e);});
$('source').onchange=()=>{options.source=$('source').value;options.sourceApp=sessions.find(s=>s.id===options.source)?.source||'';selectionVersion++;artworkKey=null;current=null;save();void refresh();};
function empty(title,text,permission=false){current=null;artworkKey=null;$('cover').hidden=true;$('cover').removeAttribute('src');$('now').hidden=true;$('empty').hidden=false;$('empty-title').textContent=title;$('empty-text').textContent=text;$('enable').hidden=!permission;if(permission){sessions=[];$('source').replaceChildren(new Option('Follow active player',''));delete $('source').dataset.options;$('title').textContent='';$('artist').textContent='';$('message').textContent='';}if(lastTitle!=='Music Remote'){lastTitle='Music Remote';void Tessera.ui.setTitle(lastTitle).catch(()=>{});}}
function render(result){
 sessions=result.sessions||[];const selected=options.source;const select=$('source');const names=sessions.map(s=>[s.id,`${sourceName(s.source)}${s.title?' · '+s.title:''}`]);if(selected&&!sessions.some(s=>s.id===selected))names.push([selected,'Selected player is closed']);
 const key=JSON.stringify(names);if(select.dataset.options!==key){select.replaceChildren(new Option('Follow active player',''),...names.map(([id,label])=>new Option(label,id)));select.dataset.options=key;}select.value=selected;
 if(!result.supported){empty('Windows media controls','Music Remote currently supports Windows media players.');return;}
 if(!result.current){empty(selected?'Player is closed':'Nothing playing yet',selected?'Choose “Follow active player” or open your selected player again.':'Start music in Spotify or another Windows player. Its controls will appear here.');return;}
 current=result.current;$('empty').hidden=true;$('now').hidden=false;$('title').textContent=current.title||'Untitled track';$('artist').textContent=current.artist||sourceName(current.source);$('play').setAttribute('aria-label',current.playing?'Pause':'Play');$('play-shape').setAttribute('href',current.playing?'#pause-icon':'#play-icon');
 $('previous').disabled=busy||!hasControl||!current.controls.previous;$('next').disabled=busy||!hasControl||!current.controls.next;$('play').disabled=busy||!hasControl||!(current.playing?current.controls.pause:current.controls.play)&&!current.controls.toggle;
 $('seek').disabled=busy||!hasControl||!current.controls.seek||current.duration<=0;$('seek').max=String(Math.max(1,current.duration));if(!seeking){$('seek').value=String(current.position);$('position').textContent=time(current.position);}$('duration').textContent=time(current.duration);
 if(Object.hasOwn(current,'artwork')){if(current.artwork){$('cover').src=current.artwork;$('cover').hidden=false;}else{$('cover').hidden=true;$('cover').removeAttribute('src');}}artworkKey=current.artworkKey;
 $('message').textContent=hasControl?'':'Playback is read-only. Enable control access in app permissions.';
 const title=current.title?`Music · ${current.title}`:'Music Remote';if(title!==lastTitle){lastTitle=title;void Tessera.ui.setTitle(title.slice(0,80)).catch(()=>{});}appearance();
}
async function refresh(){
 if(document.hidden)return;if(requesting){refreshPending=true;return;}requesting=true;
 try{
  const version=selectionVersion,info=await Tessera.getInfo();hasControl=!!info.permissions.media?.includes('control');
  if(!info.permissions.media?.includes('read')){empty('Connect your music','Allow media access to see cover art and control your Windows players.',true);return;}
  let result=await Tessera.media.snapshot(options.source||null,artworkKey);
  if(version!==selectionVersion){refreshPending=true;return;}
  // Native session IDs change after a restart. Reconnect only to the same app,
  // and only when it has exactly one live session; never choose a different app.
  if(options.source&&!result.current&&options.sourceApp){const matches=result.sessions.filter(s=>s.source===options.sourceApp);if(matches.length===1){options.source=matches[0].id;artworkKey=null;save();result=await Tessera.media.snapshot(options.source,null);}}
  if(version!==selectionVersion){refreshPending=true;return;}render(result);
 }catch(e){const message=String(e);if(/permission|revoked|removed/i.test(message)){empty('Media access is off','Allow media access in app permissions to reconnect.',true);}else{$('message').textContent=message;}}
 finally{requesting=false;if(refreshPending){refreshPending=false;queueMicrotask(()=>void refresh());}}
}
async function control(action,position){if(!current||busy)return;busy=true;let message='';$('message').textContent='';try{const result=await Tessera.media.control(current.id,action,position);if(!result.accepted)message=result.reason;}catch(e){message=String(e);}finally{busy=false;await refresh();if(message)$('message').textContent=message;}}
$('previous').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('play').onclick=()=>{const action=current?.playing?'pause':'play';return control(current?.controls[action]?action:'toggle');};
$('seek').oninput=()=>{seeking=true;$('position').textContent=time(Number($('seek').value));};$('seek').onchange=()=>{seeking=false;void control('seek',Number($('seek').value));};$('seek').onblur=()=>{seeking=false;};
(async()=>{try{await Tessera.ready;const saved=await Tessera.storage.get('preferences',null,'panel');if(saved){options={showCover:saved.showCover!==false,accent:colors.includes(saved.accent)?saved.accent:colors[0],source:typeof saved.source==='string'?saved.source:'',sourceApp:typeof saved.sourceApp==='string'?saved.sourceApp:''};}appearance();await refresh();}catch(e){$('message').textContent=String(e);}setInterval(()=>void refresh(),1500);document.addEventListener('visibilitychange',()=>{if(!document.hidden)void refresh();});})();
</script></body></html>
