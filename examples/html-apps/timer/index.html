<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timer</title><style>
:root{color-scheme:dark;font:14px system-ui;color:#e5edf3;background:#151d27}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:25px 20px;gap:24px}button,input{font:inherit;color:inherit}button{border:1px solid #314152;background:#202e3d;border-radius:10px;padding:10px 18px;cursor:pointer}button:hover{background:#2d4053}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #a7c9f0;outline-offset:2px}nav{display:flex;padding:4px;background:#101821;border-radius:12px;gap:4px}nav button{background:none;border-color:transparent;font-size:12px;padding:8px 13px}nav button[aria-selected=true]{background:#2a3b50;color:#c9e2ff}.face{display:grid;place-content:center;gap:12px;text-align:center;flex:1;width:100%;min-height:170px}#caption{text-transform:uppercase;letter-spacing:3px;font-size:10px;color:#91a7bc}#display{font-size:clamp(42px,12vw,88px);font-variant-numeric:tabular-nums;font-weight:250;letter-spacing:-3px}#progress{height:3px;background:#283747;max-width:260px;width:90%;margin:auto;border-radius:3px;overflow:hidden}#bar{height:100%;background:#a7c9f0;transform-origin:left;transition:transform .2s}#presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}#presets button{padding:7px 12px;font-size:12px}#custom{display:flex;gap:8px;align-items:center;font-size:11px;color:#99afc3}input[type=number]{width:56px;text-align:center;background:#101821;border:1px solid #314152;border-radius:7px;padding:7px}#controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}#start{background:#b7d7f6;color:#182638;min-width:105px;font-weight:600}#laps{padding:0;margin:0;width:min(280px,100%);max-height:150px;overflow:auto;scrollbar-width:thin;list-style:none;font-size:12px;color:#9fb4c8}#laps li{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #2a3949}footer{font-size:11px;color:#91a7bc;text-align:center;line-height:1.7}#error{color:#f4ac9b;font-size:12px;text-align:center}#sound{accent-color:#b7d7f6}body.done #display{color:#b5e2c4}@media(max-height:440px){body{gap:12px;padding:14px}.face{min-height:90px}#display{font-size:50px}}[hidden]{display:none!important}
</style></head><body><nav aria-label="Timer mode"><button id="countdown" aria-selected="true" disabled>Countdown</button><button id="stopwatch" aria-selected="false" disabled>Stopwatch</button></nav><div class="face"><div id="caption">Make time for focus</div><div id="display" role="timer">25:00</div><div id="progress"><div id="bar"></div></div></div><div id="presets"><button data-minutes="5" disabled>5 min</button><button data-minutes="15" disabled>15 min</button><button data-minutes="25" disabled>25 min</button><button data-minutes="50" disabled>50 min</button></div><div id="custom"><input id="minutes" type="number" min="0" max="999" value="25" aria-label="Minutes">min<input id="seconds" type="number" min="0" max="59" value="0" aria-label="Seconds">sec<button id="set" disabled>Set</button></div><div id="controls"><button id="start" disabled>Start</button><button id="lap" hidden disabled>Lap</button><button id="reset" disabled>Reset</button></div><ol id="laps"></ol><footer><label><input id="sound" type="checkbox" checked disabled>Soft chime</label><br>Each panel keeps its own timer.</footer><p id="error" role="alert"></p><script>
const $=id=>document.getElementById(id);let s={mode:'countdown',total:1500000,remaining:1500000,elapsed:0,started:0,deadline:0,running:false,done:false,laps:[],sound:true},queue=Promise.resolve(),audio=null,lastBadge;
const fmt=ms=>{const n=Math.floor(Math.max(0,ms)/1000);return(n>=3600?String(Math.floor(n/3600)).padStart(2,'0')+':':'')+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
function value(){return s.mode==='countdown'?(s.running?Math.max(0,s.deadline-Date.now()):s.remaining):(s.elapsed+(s.running?Math.max(0,Date.now()-s.started):0));}
function persist(){const data=JSON.parse(JSON.stringify(s));queue=queue.catch(()=>{}).then(()=>Tessera.storage.set('timer',data,'panel')).then(()=>{$('error').textContent='';}).catch(()=>{$('error').textContent='Could not save timer state. Try pausing and starting again.';});}
function chime(){if(!audio||!s.sound)return;for(let i=0;i<3;i++){const tone=audio.createOscillator(),gain=audio.createGain();tone.frequency.value=660;tone.connect(gain);gain.connect(audio.destination);const at=audio.currentTime+i*.25;gain.gain.setValueAtTime(.12,at);gain.gain.exponentialRampToValueAtTime(.001,at+.2);tone.start(at);tone.stop(at+.2);}}
function render(){const v=value();if(s.running&&s.mode==='countdown'&&v<=0){s.running=false;s.done=true;s.remaining=0;persist();chime();void Tessera.ui.setTitle('Timer · complete').catch(()=>{});}document.body.classList.toggle('done',s.done);$('display').textContent=fmt(s.mode==='countdown'?Math.ceil(v/1000)*1000:v);$('caption').textContent=s.done?'Time for a breather':s.running?(s.mode==='countdown'?'Focus in progress':'Stopwatch running'):s.mode==='stopwatch'?'Every moment counts':'Make time for focus';$('start').textContent=s.running?'Pause':s.done?'Start again':(s.mode==='countdown'?s.remaining<s.total:s.elapsed>0)?'Resume':'Start';for(const mode of ['countdown','stopwatch'])$(mode).setAttribute('aria-selected',String(s.mode===mode));for(const id of ['presets','custom','progress'])$(id).hidden=s.mode!=='countdown';$('lap').hidden=s.mode!=='stopwatch';$('lap').disabled=!s.running;$('bar').style.transform='scaleX('+Math.min(1,v/s.total)+')';$('sound').checked=s.sound;const badge=s.done?1:s.running?Math.min(9999,Math.ceil(v/60000)):null;if(badge!==lastBadge){lastBadge=badge;void Tessera.ui.setBadge(badge).catch(()=>{});}}
function laps(){$('laps').replaceChildren();s.laps.slice().reverse().forEach((ms,i)=>{const li=document.createElement('li'),label=document.createElement('span'),time=document.createElement('span');label.textContent='Lap '+(s.laps.length-i);time.textContent=fmt(ms)+'.'+String(Math.floor(ms%1000/10)).padStart(2,'0');li.append(label,time);$('laps').append(li);});}
function reset(){s.running=false;s.done=false;s.remaining=s.total;s.elapsed=0;s.laps=[];laps();persist();render();void Tessera.ui.setTitle('Timer').catch(()=>{});}
function duration(ms){if(!Number.isFinite(ms)||ms<1000||ms>59999000){$('error').textContent='Choose a duration from 1 second to 999 minutes, 59 seconds.';return;}s.total=ms;reset();$('minutes').value=Math.floor(ms/60000);$('seconds').value=Math.floor(ms/1000)%60;}
$('start').onclick=()=>{if(!audio){try{audio=new AudioContext();}catch{}}void audio?.resume();if(s.running){const v=value();if(s.mode==='countdown')s.remaining=v;else s.elapsed=v;s.running=false;}else{if(s.done){s.remaining=s.total;s.done=false;void Tessera.ui.setTitle('Timer').catch(()=>{});}s.started=Date.now();s.deadline=Date.now()+s.remaining;s.running=true;}persist();render();};$('reset').onclick=reset;$('lap').onclick=()=>{if(s.running&&s.laps.length<100){s.laps.push(value());laps();persist();}};$('sound').onchange=()=>{s.sound=$('sound').checked;persist();};for(const mode of ['countdown','stopwatch'])$(mode).onclick=()=>{if(s.mode!==mode){s.mode=mode;reset();}};for(const button of document.querySelectorAll('[data-minutes]'))button.onclick=()=>duration(Number(button.dataset.minutes)*60000);$('set').onclick=()=>duration((Number($('minutes').value)*60+Number($('seconds').value))*1000);
Tessera.ready.then(async()=>{const saved=await Tessera.storage.get('timer',null,'panel');if(saved&&['countdown','stopwatch'].includes(saved.mode)&&['total','remaining','elapsed','started','deadline'].every(k=>Number.isFinite(saved[k])&&saved[k]>=0)&&saved.total>0&&Array.isArray(saved.laps)){s={...s,...saved,laps:saved.laps.filter(v=>Number.isFinite(v)&&v>=0).slice(0,100)};}$('minutes').value=Math.floor(s.total/60000);$('seconds').value=Math.floor(s.total/1000)%60;document.querySelectorAll('button,input').forEach(el=>el.disabled=false);laps();render();setInterval(render,250);}).catch(e=>{$('error').textContent=String(e);});
</script></body></html>
