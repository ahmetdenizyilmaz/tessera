<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memory Break</title><style>
*{box-sizing:border-box}body{margin:0;background:#201c2c;color:#f0eaff;font:14px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}main{width:min(100%,360px)}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{font-size:18px;font-weight:600;margin:0}#stats{color:#b7a9cd;font-size:12px}#board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.card{aspect-ratio:1;border:1px solid #50415f;background:#322b41;border-radius:12px;color:#b8a4d3;font-size:28px;cursor:pointer;transition:background .16s,transform .16s}.card:hover{background:#443653;transform:translateY(-2px)}.card.open,.card.matched{background:#644c81;color:#fff}.card.matched{background:#304b49;border-color:#456c61}button:focus-visible{outline:2px solid #d1b2fa;outline-offset:3px}footer{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#b7a9cd;font-size:12px}#new{border:1px solid #625075;border-radius:8px;background:#332a43;color:#e9dbff;padding:9px 12px;cursor:pointer}
</style></head><body><main><header><h1>Memory Break</h1><span id="stats">0 turns</span></header><div id="board" aria-label="Memory cards"></div><footer><span id="result" role="status">Find the matching pairs.</span><button id="new">New game</button></footer></main><script>
const board=document.querySelector('#board'), stats=document.querySelector('#stats'), result=document.querySelector('#result');let cards=[],selected=[],matched=new Set(),turns=0,best=null,timer;
Tessera.ready.then(async()=>{best=await Tessera.storage.get('best',null);showStats();}).catch(()=>{});
function showStats(){stats.textContent=turns+' turns'+(best?' · best '+best:'');}
function render(){board.replaceChildren();cards.forEach((symbol,index)=>{const button=document.createElement('button');button.className='card'+(selected.includes(index)?' open':'')+(matched.has(index)?' matched':'');button.textContent=selected.includes(index)||matched.has(index)?symbol:'·';button.setAttribute('aria-label',matched.has(index)?'Matched '+symbol:selected.includes(index)?symbol:'Hidden card '+(index+1));button.disabled=matched.has(index);button.addEventListener('click',()=>flip(index));board.append(button);});showStats();}
async function flip(index){if(selected.length===2||matched.has(index)||selected.includes(index))return;selected.push(index);render();if(selected.length!==2)return;turns++;if(cards[selected[0]]===cards[selected[1]]){selected.forEach(i=>matched.add(i));selected=[];render();if(matched.size===cards.length){result.textContent='All pairs found. Nice break!';if(best===null||turns<best){best=turns;showStats();try{await Tessera.storage.set('best',best);}catch{result.textContent='All pairs found. Best score could not be saved.';}}}}else timer=setTimeout(()=>{selected=[];render();},800);}
function reset(){clearTimeout(timer);cards=['☀','☽','★','♣','♥','◆','▲','●'].flatMap(s=>[s,s]);for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}selected=[];matched=new Set();turns=0;result.textContent='Find the matching pairs.';render();}
document.querySelector('#new').addEventListener('click',reset);reset();
</script></body></html>
